x-build: &build
  build: .
  volumes:
    - ./${RUN_DIR:-logs/manual}:/logs

services:
  policy-db:
    <<: *build
    command: python db.py
    environment:
      DB_CAPACITY: ${DB_CAPACITY:-10}
      DB_COST_MS: ${DB_COST_MS:-80}
      DB_QUEUE_TIMEOUT_S: ${DB_QUEUE_TIMEOUT_S:-2}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  service-control:
    <<: *build
    command: python service_control.py
    depends_on:
      policy-db:
        condition: service_healthy
    environment:
      MITIGATION: ${MITIGATION:-none}
      N_TASKS: ${N_TASKS:-100}
      WARMUP_READS: ${WARMUP_READS:-5}
      DB_URL: http://policy-db:8000
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s

  client:
    <<: *build
    command: python client.py
    depends_on:
      service-control:
        condition: service_healthy
    environment:
      POISON_AT_S: ${POISON_AT_S:-20}
      REDBUTTON_AT_S: ${REDBUTTON_AT_S:-35}
      MAX_S: ${MAX_S:-240}
      STABLE_S: ${STABLE_S:-20}
      READY_FRAC: ${READY_FRAC:-0.9}
      WINDOW_S: ${WINDOW_S:-60}
      SC_URL: http://service-control:8080
      DB_URL: http://policy-db:8000
    networks: [backend, frontend]

networks:
  backend:
  frontend:
